<header class="site-header">
  <div class="utility-nav">
    {% for item in site.data.nav.utility %}
      <a href="{{ item.url | relative_url }}">{{ item.title }}</a>{% unless forloop.last %}<span>|</span>{% endunless %}
    {% endfor %}
  </div>
  <nav class="primary-nav" aria-label="Primary">
    {% for item in site.data.nav.primary %}
      {% assign is_active = page.url == item.url %}
      <a class="tab{% if is_active %} active{% endif %}" href="{{ item.url | relative_url }}">{{ item.title }}</a>
    {% endfor %}
  </nav>
</header>
